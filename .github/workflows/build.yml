name: Build and Release

on:
  push:
    branches:
      - master
    tags:
      - 'v*'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  packages: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Check environment
        shell: bash
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          echo "TypeScript version: $(npx tsc -v)"
          echo "Current directory: $(pwd)"
          echo "Directory contents:"
          ls -la

      - name: Install dependencies
        run: npm ci

      - name: Check TypeScript config
        shell: bash
        run: |
          echo "Checking tsconfig.api.json:"
          cat tsconfig.api.json
          echo ""
          echo "Checking if api directory exists:"
          ls -la api/ | head -20

      - name: Build API
        shell: bash
        run: |
          echo "Starting API build..."
          npm run build:api 2>&1 || {
            echo "Build failed with exit code $?"
            echo "Checking for TypeScript errors..."
            npx tsc -p tsconfig.api.json --noEmit 2>&1 || true
            exit 1
          }

      - name: Check API build output
        shell: bash
        run: |
          echo "Checking dist-api directory:"
          ls -la dist-api/ 2>/dev/null || echo "dist-api directory not found"

      - name: Build frontend
        run: npm run build

      - name: Build Electron app
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: List release directory
        if: always()
        shell: bash
        run: |
          echo "Current directory: $(pwd)"
          echo "Listing all files:"
          ls -la
          echo ""
          echo "Checking for release directory:"
          if [ -d "release" ]; then
            echo "Release directory found:"
            ls -la release/
          else
            echo "No release directory found"
          fi

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ${{ matrix.os }}-build
          path: |
            release/**
            dist/**
            dist-electron/**
            dist-api/**
          if-no-files-found: warn

  release-nightly:
    needs: build
    if: github.ref == 'refs/heads/master' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Organize artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) -exec cp {} release/ \;
          echo "Release artifacts:"
          ls -la release/

      - name: Create or update nightly release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: nightly
          name: Nightly Build
          files: release/*
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  release-official:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Organize artifacts
        run: |
          mkdir -p release
          find artifacts -type f \( -name "*.exe" -o -name "*.dmg" -o -name "*.zip" -o -name "*.blockmap" -o -name "*.yml" \) -exec cp {} release/ \;
          echo "Release artifacts:"
          ls -la release/

      - name: Create official release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          body: |
            ## Release ${{ github.ref_name }}
            See the [CHANGELOG](https://github.com/${{ github.repository }}/blob/master/CHANGELOG.md) for details.
          files: release/*
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
